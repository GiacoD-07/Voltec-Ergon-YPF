<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energhost - Control de Energía</title>
  
  <!-- Font Awesome para íconos modernos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-main text-light">

  <!-- Header / Navbar -->
  <header class="navbar-custom py-3 px-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-bolt text-warning fs-3"></i>
        <span class="fw-bold fs-4 tracking-wide text-white">ENERGHOST</span>
      </div>
      <div class="status-badge d-flex align-items-center gap-2 px-3 py-1 rounded-pill">
        <span class="status-dot blink"></span>
        <span id="txt-status" class="small fw-semibold text-success">EN LÍNEA</span>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    
    <!-- Banner de Alerta / Consumo Fantasma -->
    <div id="banner-fantasma" class="alert custom-alert alert-warning d-none align-items-center gap-3 mb-4" role="alert">
      <i class="fa-solid fa-triangle-exclamation fs-3"></i>
      <div>
        <strong class="d-block">Consumo Fantasma Detectado</strong>
        <span class="small opacity-75">Hay equipos en Standby consumiendo energía de forma continua.</span>
      </div>
    </div>

    <!-- Métrica Principal: Potencia Activa -->
    <div class="row g-3 mb-4">
      <div class="col-12">
        <div class="card-glass hero-card p-4 text-center position-relative overflow-hidden">
          <div class="hero-bg-glow"></div>
          <span class="text-uppercase tracking-wider text-muted-custom fw-semibold small">Potencia Instantánea</span>
          <div class="display-3 fw-extrabold my-2 text-gradient-primary">
            <span id="val-potencia">0.0</span> <small class="fs-4 text-muted-custom">W</small>
          </div>
          <div class="d-inline-flex align-items-center gap-2 mx-auto px-3 py-1 rounded-pill bg-dark-soft">
            <i class="fa-solid fa-chart-line text-info small"></i>
            <span class="small text-muted-custom">Energía Acumulada: <strong id="val-energia" class="text-white">0.00</strong> kWh</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Métricas Secundarias: Voltaje y Corriente -->
    <div class="row g-3 mb-4">
      <div class="col-6">
        <div class="card-glass p-3 text-center">
          <i class="fa-solid fa-bolt-lightning text-primary fs-4 mb-2"></i>
          <span class="d-block text-muted-custom small fw-semibold">Voltaje</span>
          <span class="fs-2 fw-bold text-white"><span id="val-voltaje">220</span> <small class="fs-6 text-muted-custom">V</small></span>
        </div>
      </div>
      <div class="col-6">
        <div class="card-glass p-3 text-center">
          <i class="fa-solid fa-wave-square text-success fs-4 mb-2"></i>
          <span class="d-block text-muted-custom small fw-semibold">Corriente</span>
          <span class="fs-2 fw-bold text-white"><span id="val-corriente">0.00</span> <small class="fs-6 text-muted-custom">A</small></span>
        </div>
      </div>
    </div>

    <!-- Sección de Control de 3 Relés -->
    <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
      <i class="fa-solid fa-sliders text-warning"></i> Control de Interruptores
    </h5>

    <div class="row g-3">
      <!-- Relé 1 -->
      <div class="col-12 col-md-4">
        <div class="card-glass p-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <div class="icon-box rounded-3 bg-dark-soft p-3 text-center">
              <i class="fa-solid fa-plug text-primary fs-4"></i>
            </div>
            <div>
              <h6 class="fw-bold mb-0 text-white">Relé 1</h6>
              <span class="small text-muted-custom" id="label-rele-1">Desconectado</span>
            </div>
          </div>
          <div class="form-check form-switch custom-switch">
            <input class="form-check-input" type="checkbox" id="switch-rele-1" onchange="toggleRele(1, this.checked)">
          </div>
        </div>
      </div>

      <!-- Relé 2 -->
      <div class="col-12 col-md-4">
        <div class="card-glass p-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <div class="icon-box rounded-3 bg-dark-soft p-3 text-center">
              <i class="fa-solid fa-tv text-info fs-4"></i>
            </div>
            <div>
              <h6 class="fw-bold mb-0 text-white">Relé 2</h6>
              <span class="small text-muted-custom" id="label-rele-2">Desconectado</span>
            </div>
          </div>
          <div class="form-check form-switch custom-switch">
            <input class="form-check-input" type="checkbox" id="switch-rele-2" onchange="toggleRele(2, this.checked)">
          </div>
        </div>
      </div>

      <!-- Relé 3 -->
      <div class="col-12 col-md-4">
        <div class="card-glass p-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <div class="icon-box rounded-3 bg-dark-soft p-3 text-center">
              <i class="fa-solid fa-lightbulb text-warning fs-4"></i>
            </div>
            <div>
              <h6 class="fw-bold mb-0 text-white">Relé 3</h6>
              <span class="small text-muted-custom" id="label-rele-3">Desconectado</span>
            </div>
          </div>
          <div class="form-check form-switch custom-switch">
            <input class="form-check-input" type="checkbox" id="switch-rele-3" onchange="toggleRele(3, this.checked)">
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
