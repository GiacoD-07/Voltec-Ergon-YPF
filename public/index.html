<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energhost - Control de Energía</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Space Grotesk (interfaz) + IBM Plex Mono (lecturas numéricas) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 (utilidades d-none / d-flex usadas por app.js) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-main text-light">

  <!-- Header -->
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
        <span class="brand-name">ENERGHOST</span>
      </div>
      <div class="status-chip">
        <span class="status-dot blink"></span>
        <span id="txt-status" class="status-text text-success">EN LÍNEA</span>
      </div>
    </div>
  </header>

  <main class="container pb-5">

    <!-- Alerta de Consumo Fantasma -->
    <div id="banner-fantasma" class="phantom-alert d-none" role="alert">
      <div class="phantom-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="phantom-copy">
        <strong>Consumo Fantasma Detectado</strong>
        <span>Hay equipos en standby consumiendo energía de forma continua.</span>
      </div>
    </div>

    <!-- Potencia Instantánea / Energía Acumulada -->
    <section class="panel hero-panel reveal" style="--delay:0s">
      <svg class="hero-wave" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 60 L60 60 L80 20 L110 100 L140 40 L165 60 L220 60 L240 25 L265 95 L290 60 L600 60"
              fill="none" stroke="currentColor" stroke-width="2" />
      </svg>

      <div class="hero-grid">
        <div class="hero-primary">
          <span class="metric-label">Potencia Instantánea</span>
          <div class="metric-value-lg">
            <span id="val-potencia">0.0</span><span class="unit">W</span>
          </div>
        </div>

        <div class="hero-divider" aria-hidden="true"></div>

        <div class="hero-secondary">
          <span class="metric-label"><i class="fa-solid fa-chart-line"></i> Energía Acumulada</span>
          <div class="metric-value-md">
            <span id="val-energia">0.00</span><span class="unit">kWh</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Voltaje / Corriente -->
    <section class="panel reading-strip reveal" style="--delay:0.08s">
      <div class="reading">
        <i class="fa-solid fa-bolt-lightning reading-icon volt"></i>
        <div>
          <span class="metric-label">Voltaje</span>
          <div class="metric-value-sm"><span id="val-voltaje">220</span><span class="unit">V</span></div>
        </div>
      </div>
      <div class="reading-divider" aria-hidden="true"></div>
      <div class="reading">
        <i class="fa-solid fa-wave-square reading-icon amp"></i>
        <div>
          <span class="metric-label">Corriente</span>
          <div class="metric-value-sm"><span id="val-corriente">0.00</span><span class="unit">A</span></div>
        </div>
      </div>
    </section>

    <!-- Control de Interruptores -->
    <h2 class="section-title reveal" style="--delay:0.16s">
      <i class="fa-solid fa-sliders"></i> Control de Interruptores
    </h2>

    <div class="relay-grid">

      <div class="panel relay-card reveal" style="--delay:0.2s">
        <span class="relay-accent relay-accent-1"></span>
        <div class="relay-info">
          <div class="relay-icon relay-icon-1"><i class="fa-solid fa-plug"></i></div>
          <div>
            <h3 class="relay-name">Relé 1</h3>
            <span class="relay-status" id="label-rele-1">Desconectado</span>
          </div>
        </div>
        <label class="relay-toggle">
          <input type="checkbox" id="switch-rele-1" onchange="toggleRele(1, this.checked)">
          <span class="relay-track"><span class="relay-thumb"></span></span>
        </label>
      </div>

      <div class="panel relay-card reveal" style="--delay:0.26s">
        <span class="relay-accent relay-accent-2"></span>
        <div class="relay-info">
          <div class="relay-icon relay-icon-2"><i class="fa-solid fa-tv"></i></div>
          <div>
            <h3 class="relay-name">Relé 2</h3>
            <span class="relay-status" id="label-rele-2">Desconectado</span>
          </div>
        </div>
        <label class="relay-toggle">
          <input type="checkbox" id="switch-rele-2" onchange="toggleRele(2, this.checked)">
          <span class="relay-track"><span class="relay-thumb"></span></span>
        </label>
      </div>

      <div class="panel relay-card reveal" style="--delay:0.32s">
        <span class="relay-accent relay-accent-3"></span>
        <div class="relay-info">
          <div class="relay-icon relay-icon-3"><i class="fa-solid fa-lightbulb"></i></div>
          <div>
            <h3 class="relay-name">Relé 3</h3>
            <span class="relay-status" id="label-rele-3">Desconectado</span>
          </div>
        </div>
        <label class="relay-toggle">
          <input type="checkbox" id="switch-rele-3" onchange="toggleRele(3, this.checked)">
          <span class="relay-track"><span class="relay-thumb"></span></span>
        </label>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
